[tools]
python = "3.12"

[tasks.app]
description = "Serve the Pick a Game site and the Bike Race race server locally (PORT defaults to 8000)"
run = "python tools/serve.py"

[tasks.phone]
description = "Serve the site over https on your Wi-Fi, so Bike Race can use tilt and race other phones (PORT defaults to 8443)"
run = "python tools/serve.py --https"
